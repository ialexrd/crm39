<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЧИСТКА39 — CRM (тестовая версия)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; -webkit-text-size-adjust: 100%; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .login-card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.1); padding: 2rem; width: 100%; max-width: 360px; }
  .login-logo { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
  .login-logo span { color: #888; font-weight: 400; }
  .login-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .login-field label { font-size: 12px; color: #888; font-weight: 500; }
  .login-error { font-size: 13px; color: #c0392b; margin-bottom: 12px; min-height: 18px; }

  .app { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; display: none; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
  .logo { font-size: 17px; font-weight: 500; }
  .logo span { color: #888; font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conn-status { font-size: 12px; color: #999; display: flex; align-items: center; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #ccc; }
  .status-dot.ok { background: #27ae60; }
  .status-dot.err { background: #e74c3c; }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .role-badge.admin { background: #f0f0f0; color: #333; }
  .role-badge.spec { background: #e8f4fd; color: #1a6fa8; }
  .btn-logout { padding: 5px 12px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 12px; cursor: pointer; color: #666; }
  .tabs { display: flex; gap: 2px; background: #e5e5e5; border-radius: 8px; padding: 3px; }
  .tab { padding: 6px 14px; border-radius: 6px; border: none; background: transparent; cursor: pointer; font-size: 13px; color: #666; transition: all .15s; }
  .tab.active { background: #fff; color: #1a1a1a; font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .section { display: none; }
  .section.visible { display: block; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1.25rem; }
  .stat { background: #fff; border-radius: 8px; padding: .75rem 1rem; border: 0.5px solid rgba(0,0,0,.1); }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .stat-value { font-size: 20px; font-weight: 500; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .toolbar-label { font-size: 12px; color: #888; white-space: nowrap; }
  .search-input { padding: 7px 10px; border: 0.5px solid rgba(0,0,0,.15); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; width: 180px; background: #fff; }
  .date-input { padding: 7px 8px; border: 0.5px solid rgba(0,0,0,.15); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; background: #fff; color: #1a1a1a; }
  .btn-preset { padding: 6px 11px; border-radius: 7px; border: 0.5px solid rgba(0,0,0,.15); background: #fff; font-size: 12px; cursor: pointer; color: #555; transition: all .12s; }
  .btn-preset.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .divider { width: 0.5px; height: 18px; background: rgba(0,0,0,.12); margin: 0 2px; }

  .table-wrap { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.1); overflow: hidden; }
  .desktop-view { display: block; }
  .mobile-view { display: none; }

  @media (max-width: 700px) {
    .desktop-view { display: none; }
    .mobile-view { display: block; }
    .stats { gap: 6px; }
    .stat-value { font-size: 16px; }
    .stat-label { font-size: 10px; }
    .search-input { width: 100%; }
    .divider { display: none; }
  }
  @media (max-width: 400px) {
    .stats { grid-template-columns: 1fr 1fr; }
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { padding: 9px 12px; text-align: left; font-weight: 500; font-size: 11px; color: #888; border-bottom: 0.5px solid rgba(0,0,0,.08); background: #fafafa; white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 0.5px solid rgba(0,0,0,.06); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .sum-cell { font-weight: 500; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; background: #f0f0f0; color: #555; }
  .actions { display: flex; gap: 5px; }
  .btn-icon { width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.12); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; transition: all .12s; }
  .btn-icon:hover { background: #f0f0f0; }
  .btn-icon.danger:hover { background: #fff0f0; color: #c0392b; border-color: #ffbcbc; }

  .order-card { padding: 12px 16px; border-bottom: 0.5px solid rgba(0,0,0,.07); position: relative; min-height: 118px; }
  .order-card:last-child { border-bottom: none; }
  .card-addr-row { font-size: 14px; font-weight: 500; word-break: break-word; margin-bottom: 3px; }
  .card-date-row { font-size: 14px; font-weight: 700; color: #f5a623; margin-bottom: 3px; }
  .card-name-row { font-size: 14px; color: #444; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 2px; }
  .card-name-row .card-name { font-weight: 500; }
  .card-name-row .card-phone { white-space: nowrap; }
  .card-row3 { font-size: 12px; color: #aaa; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; padding-right: 105px; }
  .card-sum { font-weight: 500; color: #1a1a1a; }
  .card-sum-inline { font-weight: 700; font-size: 14px; color: #1a1a1a; white-space: nowrap; }
  .card-bottom { position: absolute; bottom: 12px; right: 16px; }
  .card-actions-icons { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .card-actions { display: flex; gap: 8px; margin-top: 8px; }
  .card-actions-icons { display: flex; gap: 5px; }
  .card-btn { padding: 4px 12px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 12px; cursor: pointer; color: #555; }
  .card-btn.danger { color: #c0392b; border-color: #f5bcbc; }

  .tab-count { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px; border-radius: 8px; background: #e74c3c; color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  .lead { padding: 12px 16px; border-bottom: 0.5px solid rgba(0,0,0,.07); }
  .lead:last-child { border-bottom: none; }
  .lead-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .lead-name { font-weight: 500; font-size: 14px; }
  .lead-when { font-size: 12px; color: #999; margin-left: auto; }
  .lead-row { font-size: 13px; color: #444; margin-top: 4px; }
  .lead-note { font-size: 12.5px; color: #777; margin-top: 4px; white-space: pre-wrap; }
  .badge.st-new { background: #fdecea; color: #c0392b; }
  .badge.st-thinking { background: #fff6e0; color: #9a6b00; }
  .badge.st-booked { background: #e6f6ec; color: #1e8449; font-weight: 500; }
  .lead.booked { background: #f6fcf8; }
  .lead-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .lead-btn { padding: 5px 11px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 12px; cursor: pointer; color: #333; }
  .lead-btn.main { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .lead-btn.danger { color: #c0392b; border-color: #f5bcbc; }
  .empty { padding: 2.5rem; text-align: center; color: #aaa; font-size: 14px; }
  .loading { padding: 2rem; text-align: center; color: #aaa; font-size: 14px; }

  .form-card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,.1); padding: 1.5rem; max-width: 560px; }
  .form-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: #888; font-weight: 500; }
  input { border: 0.5px solid rgba(0,0,0,.18); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; color: #1a1a1a; background: #fff; outline: none; width: 100%; transition: border-color .12s; }
  input:focus { border-color: rgba(0,0,0,.4); }
  .form-actions { display: flex; gap: 10px; margin-top: 1.25rem; flex-wrap: wrap; }
  .btn-primary { padding: 9px 20px; border-radius: 8px; border: none; background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary { padding: 9px 20px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,.15); background: transparent; font-size: 14px; cursor: pointer; color: #666; }
  .form-note { font-size: 12px; color: #aaa; margin-top: 8px; }

  @media (max-width: 500px) {
    .form-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: 1; }
  }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .phone-count { display: inline-flex; align-items: center; justify-content: center; background: #e74c3c; color: #fff; border-radius: 50%; width: 17px; height: 17px; font-size: 10px; font-weight: 700; margin-left: 5px; flex-shrink: 0; vertical-align: middle; }

  .history-section { margin-top: 1.5rem; border-top: 0.5px solid rgba(0,0,0,.1); padding-top: 1.25rem; }
  .history-title { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; }
  .history-item { background: #fafafa; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; border: 0.5px solid rgba(0,0,0,.08); }
  .history-item-date { font-weight: 600; color: #f5a623; margin-bottom: 3px; font-size: 13px; }
  .history-item-addr { color: #1a1a1a; margin-bottom: 3px; }
  .history-item-meta { color: #aaa; font-size: 11px; }
  :root { --brand-accent: #2563EB; }
  .btn-primary, .btn-preset.active, .lead-btn.main { background: var(--brand-accent); border-color: var(--brand-accent); color: #fff; }
  .tab.active { color: var(--brand-accent); }
  .tabs { background: #E8F0FE; }
  .card-date-row, .history-item-date { color: var(--brand-accent); }
  input:focus, .search-input:focus, .date-input:focus { border-color: var(--brand-accent); }
</style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">ЧИСТКА39 <span>/ тестовая CRM</span></div>
    <div class="login-error" id="login-error" style="min-height:0;margin-bottom:12px;overflow-wrap:anywhere"></div>
    <button class="btn-primary" id="login-btn" onclick="window.doLogin()" style="width:100%">Войти через Google</button>
  </div>
</div>

<div class="app" id="app">
  <div class="header">
    <div class="logo"><img src="logo.svg?v=2" alt="ЧИСТКА39" style="height:40px;max-width:190px;width:auto;display:block;object-fit:contain"></div>
    <div class="header-right">
      <div class="conn-status"><span class="status-dot" id="conn-dot"></span><span id="conn-text">...</span></div>
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-logout" onclick="window.doLogout()">Выйти</button>
      <div class="tabs">
        <button class="tab active" data-tab="list" onclick="window.showTab('list')">Заказы</button>
        <button class="tab" data-tab="leads" id="tab-leads" onclick="window.showTab('leads')" style="display:none">Заявки<span class="tab-count" id="leads-count" style="display:none"></span></button>
        <button class="tab" data-tab="form" id="tab-add" onclick="window.showTab('form')" style="display:none">+ Добавить</button>
      </div>
    </div>
  </div>

  <div id="sec-list" class="section visible">
    <div class="stats">
      <div class="stat"><div class="stat-label">Заказов</div><div class="stat-value" id="st-total">—</div></div>
      <div class="stat"><div class="stat-label">Сумма</div><div class="stat-value" id="st-sum">—</div></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn-preset active" id="pre-week" onclick="window.setPreset('week')">Неделя</button>
        <button class="btn-preset" id="pre-month" onclick="window.setPreset('month')">Месяц</button>
        <button class="btn-preset" id="pre-all" onclick="window.setPreset('all')">Все</button>
      </div>
      <div class="divider"></div>
      <div class="toolbar-group">
        <span class="toolbar-label">С</span>
        <input class="date-input" type="date" id="date-from" onchange="window.onDateChange()">
        <span class="toolbar-label">по</span>
        <input class="date-input" type="date" id="date-to" onchange="window.onDateChange()">
      </div>
      <div class="divider"></div>
      <input class="search-input" type="text" placeholder="Поиск..." oninput="window.applyFilters()" id="search-input">
    </div>
    <div class="table-wrap">
      <div class="loading" id="loading-state">Загрузка...</div>
      <div class="desktop-view">
        <table id="main-table" style="display:none">
          <thead><tr id="table-head"></tr></thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
      <div class="mobile-view">
        <div id="cards-list"></div>
      </div>
      <div id="empty-state" class="empty" style="display:none">Нет заказов за выбранный период</div>
    </div>
  </div>

  <div id="sec-leads" class="section">
    <div class="table-wrap">
      <div id="leads-list"></div>
      <div id="leads-empty" class="empty" style="display:none">Новых заявок нет</div>
    </div>
  </div>

  <div id="sec-form" class="section">
    <div class="form-card">
      <div class="form-title" id="form-title">Новый заказ</div>
      <div class="form-grid">
        <div class="field"><label>Имя клиента *</label><input id="f-name" type="text" placeholder="Иван Иванов"></div>
        <div class="field"><label>Телефон *</label><input id="f-phone" type="tel" placeholder="+7 900 000-00-00"></div>
        <div class="field full"><label>Адрес *</label><input id="f-addr" type="text" placeholder="ул. Ленина, 10, кв. 5"></div>
        <div class="field"><label>Дата визита *</label><input id="f-date" type="date"></div>
        <div class="field"><label>Время визита</label><input id="f-time" type="time"></div>
        <div class="field"><label>Сумма (₽)</label><input id="f-sum" type="number" placeholder="0" min="0"></div>
        <div class="field"><label>Источник</label><input id="f-src" type="text" placeholder="Авито, ВК, сарафан..."></div>
        <div class="field full"><label>Специалист</label><input id="f-spec" type="text" placeholder="Имя специалиста"></div>
        <div class="field full"><label>Объём заказа</label><input id="f-vol" type="text" placeholder="Что будет на заказе..."></div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" id="save-btn" onclick="window.saveOrder()">Сохранить заказ</button>
        <button class="btn-secondary" onclick="window.cancelEdit()">Отмена</button>
      </div>
      <div class="form-note">* Обязательные поля</div>
      <div id="order-history" class="history-section" style="display:none"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMOczuaW3VmmSSS-c1ssrHT-HUtPE80lM",
    authDomain: "crm39-14e55.firebaseapp.com",
    projectId: "crm39-14e55",
    storageBucket: "crm39-14e55.firebasestorage.app",
    messagingSenderId: "267778440818",
    appId: "1:267778440818:web:bb38140e6009e05dfdcceb",
    measurementId: "G-RVY1HVC1QR"
  };

  // First sign in with Google, copy your Firebase User UID, then put it here.
  // No access to orders is granted in the UI until an administrator UID is configured.
  const ADMIN_UIDS = ["7dtUmiioRhgELpDIPJkRhVfA7wX2"];
  const SHEETS_URL = ""; // Separate test Google Sheet needed

  const app = initializeApp(firebaseConfig);
  const db = initializeFirestore(app, {
    localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
  });
  const auth = getAuth(app);
  const ordersCol = collection(db, "orders");

  // Заявки от бота: new — новая, thinking — думает. Записанные заказы: booked или без статуса (старые).
  const LEAD_STATUSES = ['new', 'thinking'];
  const LEAD_STATUS_RU = {new: 'новая', thinking: 'думает'};

  let allOrders = [], editId = null, isAdmin = false, unsubscribe = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function toYMD(d) { return d.toISOString().split('T')[0]; }

  function setConn(ok) {
    document.getElementById('conn-dot').className = 'status-dot ' + (ok ? 'ok' : 'err');
    document.getElementById('conn-text').textContent = ok ? 'Подключено' : 'Ошибка';
  }

  function initDates() {
    const today = new Date(), plus7 = new Date();
    plus7.setDate(today.getDate() + 7);
    document.getElementById('date-from').value = toYMD(today);
    document.getElementById('date-to').value = toYMD(plus7);
  }

  function fmt(d, t) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    const date = new Date(+y, +m-1, +day);
    const today = new Date();
    today.setHours(0,0,0,0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    let dayStr;
    if (date.getTime() === today.getTime()) dayStr = 'Сегодня';
    else if (date.getTime() === tomorrow.getTime()) dayStr = 'Завтра';
    else {
      const fullDays = ['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];
      dayStr = fullDays[date.getDay()];
    }
    return day+'.'+m+'.'+y+' ('+dayStr+')'+(t?' '+t:'');
  }

  async function syncToSheets(order) {
    try {
      if (!SHEETS_URL) return;
      const params = new URLSearchParams();
      Object.keys(order).forEach(k => params.append(k, order[k] || ''));
      const img = new Image();
      img.src = SHEETS_URL + '?' + params.toString();
    } catch(e) { console.warn('Sheets sync failed:', e); }
  }

  window.setPreset = function(p) {
    ['week','month','all'].forEach(x => document.getElementById('pre-'+x).classList.toggle('active', x===p));
    const today = new Date();
    if (p==='week') { const e=new Date(); e.setDate(today.getDate()+7); document.getElementById('date-from').value=toYMD(today); document.getElementById('date-to').value=toYMD(e); }
    else if (p==='month') { const e=new Date(); e.setDate(today.getDate()+30); document.getElementById('date-from').value=toYMD(today); document.getElementById('date-to').value=toYMD(e); }
    else { document.getElementById('date-from').value=''; document.getElementById('date-to').value=''; }
    window.applyFilters();
  };

  window.onDateChange = function() {
    ['week','month','all'].forEach(p => document.getElementById('pre-'+p).classList.remove('active'));
    window.applyFilters();
  };

  window.applyFilters = function() {
    const from = document.getElementById('date-from').value;
    const to = document.getElementById('date-to').value;
    const q = document.getElementById('search-input').value.toLowerCase();
    let f = allOrders.filter(o => !LEAD_STATUSES.includes(o.status) && o.status !== 'lost');
    if (from) f = f.filter(o => o.date >= from);
    if (to)   f = f.filter(o => o.date <= to);
    if (q)    f = f.filter(o => (o.name||'').toLowerCase().includes(q)||(o.addr||'').toLowerCase().includes(q)||(o.phone||'').toLowerCase().includes(q));
    f.sort((a,b) => {
      if (a.date !== b.date) return (a.date||'').localeCompare(b.date||'');
      return (a.time || '').localeCompare(b.time || '');
    });
    renderList(f);
  };

  function updateStats(orders) {
    document.getElementById('st-total').textContent = orders.length;
    document.getElementById('st-sum').textContent = orders.reduce((s,o)=>s+(Number(o.sum)||0),0).toLocaleString('ru')+' ₽';

  }

  function buildTableHead() {
    const h = document.getElementById('table-head');
    if (isAdmin) h.innerHTML = '<th>Адрес</th><th>Клиент</th><th>Телефон</th><th>Дата и время</th><th>Сумма</th><th>Объём заказа</th><th>Источник</th><th>Специалист</th><th></th>';
    else         h.innerHTML = '<th>Адрес</th><th>Клиент</th><th>Дата и время</th><th>Сумма</th><th>Объём заказа</th><th>Источник</th><th>Специалист</th>';
  }

  function renderList(orders) {
    const tbody = document.getElementById('orders-body');
    const cards = document.getElementById('cards-list');
    const empty = document.getElementById('empty-state');
    const table = document.getElementById('main-table');
    document.getElementById('loading-state').style.display = 'none';
    tbody.innerHTML = ''; cards.innerHTML = '';
    updateStats(orders);
    if (!orders.length) { table.style.display='none'; empty.style.display='block'; return; }
    table.style.display = 'table'; empty.style.display = 'none';

    const phoneKey = p => p ? p.replace(/\D/g,'').slice(-10) : '';
    const phoneCounts = {};
    allOrders.forEach(o => { if (o.phone) { const k=phoneKey(o.phone); phoneCounts[k]=(phoneCounts[k]||0)+1; } });

    orders.forEach(o => {
      const countBadge = (o.phone && phoneCounts[phoneKey(o.phone)] > 1) ? `<span class="phone-count">${phoneCounts[phoneKey(o.phone)]}</span>` : '';
      const tr = document.createElement('tr');
      if (isAdmin) {
        tr.innerHTML = `<td>${o.addr}</td><td>${o.name}</td><td><a href="tel:${o.phone}" style="color:inherit;text-decoration:none">${o.phone}</a>${countBadge}</td><td>${fmt(o.date,o.time)}</td><td class="sum-cell">${o.sum?Number(o.sum).toLocaleString('ru')+' ₽':'—'}</td><td>${o.vol||'—'}</td><td><span class="badge">${o.src||'—'}</span></td><td>${o.spec||'—'}</td><td><div class="actions"><button class="btn-icon" onclick="window._edit('${o.id}')">✎</button><button class="btn-icon danger" onclick="window._del('${o.id}')">✕</button></div></td>`;
      } else {
        tr.innerHTML = `<td>${o.addr}</td><td>${o.name}</td><td>${fmt(o.date,o.time)}</td><td class="sum-cell">${o.sum?Number(o.sum).toLocaleString('ru')+' ₽':'—'}</td><td>${o.vol||'—'}</td><td><span class="badge">${o.src||'—'}</span></td><td>${o.spec||'—'}</td>`;
      }
      tbody.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'order-card';
      const maskedPhone = o.phone ? o.phone.slice(0, -4) + '****' : '';
      const phoneRow = isAdmin ? `<span class="card-phone" id="ph-${o.id}">${maskedPhone}${countBadge}</span>` : '';
      const sumStr = o.sum ? Number(o.sum).toLocaleString('ru')+' ₽' : '';
      const sumSpan = sumStr ? `<span class="card-sum-inline">${sumStr}</span>` : '';
      const btns = isAdmin ? `<div class="card-actions-icons"><button class="btn-icon" onclick="window._edit('${o.id}')">✎</button><button class="btn-icon" onclick="window._revealPhone('${o.id}','${o.phone}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/><path d="M15 1v2c3.31 0 6 2.69 6 6h2c0-4.42-3.58-8-8-8z"/><path d="M15 5v2c1.1 0 2 .9 2 2h2c0-2.21-1.79-4-4-4z"/></svg></button><button class="btn-icon danger" onclick="window._del('${o.id}')">✕</button></div>` : '';
      const meta = [o.vol, o.src, o.spec].filter(Boolean);
      card.innerHTML = `
        <div class="card-addr-row">${o.addr}</div>
        <div class="card-date-row">${fmt(o.date,o.time)}</div>
        <div class="card-name-row"><span class="card-name">${o.name}</span>${phoneRow}${sumSpan}</div>
        ${meta.length ? `<div class="card-row3">${meta.map(m=>`<span>${m}</span>`).join('')}</div>` : ''}
        ${btns ? `<div class="card-bottom">${btns}</div>` : ''}`;
      cards.appendChild(card);
    });
  }

  function startListening() {
    if (unsubscribe) unsubscribe();
    const q = query(ordersCol, orderBy("date","asc"));
    unsubscribe = onSnapshot(q, snap => {
      allOrders = snap.docs.map(d=>({id:d.id,...d.data()}));
      setConn(true); window.applyFilters(); renderLeads();
    }, () => { setConn(false); document.getElementById('loading-state').textContent='Ошибка загрузки.'; });
  }

  onAuthStateChanged(auth, user => {
    const loginWrap = document.getElementById('login-wrap');
    const appElement = document.getElementById('app');
    const loginButton = document.getElementById('login-btn');
    const errorBox = document.getElementById('login-error');
    if (user && !ADMIN_UIDS.includes(user.uid)) {
      // Show only the Firebase Auth UID. Never start a Firestore data listener.
      isAdmin = false;
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      loginWrap.style.display = 'flex';
      appElement.style.display = 'none';
      errorBox.textContent = 'Google-вход выполнен. Доступ к CRM пока закрыт. Ваш User UID: ' + user.uid + '. Скопируйте UID для настройки прав доступа.';
      loginButton.textContent = 'Выйти из Google';
      loginButton.disabled = false;
      loginButton.onclick = () => signOut(auth);
      return;
    }
    if (user) {
      isAdmin = true;
      loginWrap.style.display = 'none';
      appElement.style.display = 'block';
      errorBox.textContent = '';
      const badge = document.getElementById('role-badge');
      badge.textContent = 'Админ';
      badge.className = 'role-badge admin';
      document.getElementById('tab-add').style.display = '';
      document.getElementById('tab-leads').style.display = '';
      buildTableHead(); initDates(); startListening();
    } else {
      loginWrap.style.display = 'flex';
      appElement.style.display = 'none';
      errorBox.textContent = '';
      loginButton.textContent = 'Войти через Google';
      loginButton.disabled = false;
      loginButton.onclick = window.doLogin;
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    }
  });

  window.doLogin = async function() {
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Вход через Google...';
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch(e) {
      const messages = {
        'auth/popup-closed-by-user': 'Вход отменён.',
        'auth/popup-blocked': 'Браузер заблокировал окно Google. Разрешите всплывающие окна.',
        'auth/unauthorized-domain': 'Добавьте домен сайта в Firebase Authentication → Settings → Authorized domains.'
      };
      err.textContent = messages[e.code] || ('Ошибка входа: ' + (e.code || 'неизвестная ошибка'));
      btn.disabled = false;
      btn.textContent = 'Войти через Google';
    }
  };

  window.doLogout = () => signOut(auth);

  window.showTab = function(t) {
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab===t));
    document.getElementById('sec-list').classList.toggle('visible', t==='list');
    document.getElementById('sec-leads').classList.toggle('visible', t==='leads');
    document.getElementById('sec-form').classList.toggle('visible', t==='form');
  };

  function clearForm() {
    ['f-name','f-phone','f-addr','f-date','f-time','f-sum','f-src','f-spec','f-vol'].forEach(id => document.getElementById(id).value = '');
    editId = null;
    document.getElementById('form-title').textContent = 'Новый заказ';
    document.getElementById('save-btn').disabled = false;
    document.getElementById('save-btn').textContent = 'Сохранить заказ';
    document.getElementById('order-history').style.display = 'none';
  }

  window.saveOrder = async function() {
    if (!isAdmin) return;
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const addr = document.getElementById('f-addr').value.trim();
    const date = document.getElementById('f-date').value;
    if (!name||!phone||!addr||!date) { alert('Заполните: имя, телефон, адрес, дата'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Сохранение...';
    const order = {
      name, phone, addr, date,
      time: document.getElementById('f-time').value,
      sum: document.getElementById('f-sum').value,
      src: document.getElementById('f-src').value.trim(),
      spec: document.getElementById('f-spec').value.trim(),
      vol: document.getElementById('f-vol').value.trim()
    };
    const editing = editId ? allOrders.find(x => x.id===editId) : null;
    const fromLead = editing && LEAD_STATUSES.includes(editing.status);
    try {
      if (editId) {
        if (fromLead) order.status = 'booked';
        await updateDoc(doc(db,"orders",editId), order);
        if (fromLead) syncToSheets(order);
        showToast(fromLead ? 'Заявка записана в заказы' : 'Заказ обновлён');
      } else {
        order.status = 'booked';
        order.createdAt = Date.now();
        await addDoc(ordersCol, order);
        syncToSheets(order);
        showToast('Заказ добавлен');
      }
      clearForm(); window.showTab('list');
    } catch(e) {
      alert('Ошибка: ' + e.message);
      btn.disabled = false; btn.textContent = 'Сохранить заказ';
    }
  };

  window._edit = function(id) {
    if (!isAdmin) return;
    const o = allOrders.find(x => x.id===id); if (!o) return;
    editId = id;
    ['name','phone','addr','date','time','sum','src','spec','vol'].forEach(k => document.getElementById('f-'+k).value = o[k]||'');
    document.getElementById('form-title').textContent = LEAD_STATUSES.includes(o.status) ? 'Записать заявку' : 'Редактировать заказ';
    document.getElementById('save-btn').disabled = false;
    document.getElementById('save-btn').textContent = 'Сохранить заказ';
    const histEl = document.getElementById('order-history');
    if (o.phone) {
      const phoneKey = p => p ? p.replace(/\D/g,'').slice(-10) : '';
      const history = allOrders
        .filter(x => x.phone && phoneKey(x.phone) === phoneKey(o.phone) && x.id !== id)
        .sort((a,b) => b.date.localeCompare(a.date) || (b.time||'').localeCompare(a.time||''));
      if (history.length) {
        histEl.innerHTML = `<div class="history-title">История по этому номеру (${history.length})</div>` +
          history.map(h => {
            const meta = [h.sum ? Number(h.sum).toLocaleString('ru')+' ₽' : '', h.spec, h.src, h.vol].filter(Boolean).join(' · ');
            return `<div class="history-item">
              <div class="history-item-date">${fmt(h.date, h.time)}</div>
              <div class="history-item-addr">${h.addr}</div>
              ${h.name !== o.name ? `<div class="history-item-meta">Имя: ${h.name}</div>` : ''}
              ${meta ? `<div class="history-item-meta">${meta}</div>` : ''}
            </div>`;
          }).join('');
        histEl.style.display = 'block';
      } else {
        histEl.style.display = 'none';
      }
    } else {
      histEl.style.display = 'none';
    }
    window.showTab('form');
  };

  window._del = async function(id) {
    if (!isAdmin || !confirm('Удалить заказ?')) return;
    try { await deleteDoc(doc(db,"orders",id)); showToast('Заказ удалён'); }
    catch(e) { alert('Ошибка: ' + e.message); }
  };

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtCreated(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.toLocaleDateString('ru', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
  }

  function localYMD(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // Заявки, которые бот записал по фразе «Записал»: остаются здесь с зелёной отметкой, пока визит впереди
  function isBookedLead(o, today) {
    return o.source === 'bot' && o.status === 'booked' && (!o.date || o.date >= today);
  }

  function bookedLabel(o) {
    if (!o.date) return 'Записан, дата не указана';
    const [y, m, d] = o.date.split('-');
    return 'Записан на ' + d + '.' + m + (o.time ? ' ' + o.time : '');
  }

  function renderLeads() {
    const today = localYMD(new Date());
    const open = allOrders.filter(o => LEAD_STATUSES.includes(o.status))
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const booked = allOrders.filter(o => isBookedLead(o, today))
      .sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.time||'').localeCompare(b.time||''));
    const leads = open.concat(booked);
    const count = document.getElementById('leads-count');
    const fresh = leads.filter(o => o.status === 'new').length;
    count.textContent = fresh; count.style.display = fresh ? '' : 'none';
    document.getElementById('leads-empty').style.display = leads.length ? 'none' : 'block';
    document.getElementById('leads-list').innerHTML = leads.map(o => {
      const contacts = [o.phone ? `<a href="tel:${esc(o.phone)}" style="color:inherit">${esc(o.phone)}</a>` : '', esc(o.addr)].filter(Boolean).join(' · ');
      const isBooked = o.status === 'booked';
      const think = isBooked ? ''
        : o.status === 'thinking'
        ? `<button class="lead-btn" onclick="window._leadStatus('${o.id}','new')">Вернуть в новые</button>`
        : `<button class="lead-btn" onclick="window._leadStatus('${o.id}','thinking')">Думает</button>`;
      return `<div class="lead${isBooked ? ' booked' : ''}">
        <div class="lead-top"><span class="lead-name">${esc(o.name) || 'Без имени'}</span>
          <span class="badge st-${o.status}">${isBooked ? '✓ ' + esc(bookedLabel(o)) : LEAD_STATUS_RU[o.status]}</span>
          ${o.src ? `<span class="badge">${esc(o.src)}</span>` : ''}
          <span class="lead-when">${fmtCreated(o.createdAt)}</span></div>
        ${contacts ? `<div class="lead-row">${contacts}</div>` : ''}
        ${o.vol ? `<div class="lead-row">${esc(o.vol)}</div>` : ''}
        ${o.note ? `<div class="lead-note">${esc(o.note)}</div>` : ''}
        <div class="lead-actions">
          <button class="lead-btn${isBooked ? '' : ' main'}" onclick="window._edit('${o.id}')">${isBooked ? 'Изменить' : 'Записать'}</button>
          ${think}
          <button class="lead-btn" onclick="window._leadStatus('${o.id}','lost')">Отказ</button>
          <button class="lead-btn danger" onclick="window._del('${o.id}')">Удалить</button>
        </div></div>`;
    }).join('');
  }

  window._leadStatus = async function(id, status) {
    if (!isAdmin) return;
    try {
      await updateDoc(doc(db,"orders",id), {status, updatedAt: Date.now()});
      showToast(status === 'lost' ? 'Отмечено: отказ' : 'Статус обновлён');
    } catch(e) { alert('Ошибка: ' + e.message); }
  };

  window.cancelEdit = function() { clearForm(); window.showTab('list'); };

  window._revealPhone = function(id, phone) {
    const el = document.getElementById('ph-' + id);
    if (el) el.innerHTML = `<a href="tel:${phone}" style="color:inherit;text-decoration:none">${phone}</a>`;
  };
</script>
</body>
</html>
